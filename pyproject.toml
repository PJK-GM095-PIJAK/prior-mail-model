[project]
name = "prior-mail-model"
version = "0.1.0"
description = "PriorMail ML: DistilBERT fine-tuning for email priority + phishing classification"
readme = "README.md"
# Tech Stack is LOCKED to Python 3.11 (CLAUDE.md §4). Do not widen without proposing.
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Insan" },
    { name = "Faiz" },
    { name = "Syafiq" },
]

# --- Core ML stack (LOCKED — see CLAUDE.md §4; do not swap) ---
dependencies = [
    "torch>=2.2,<3.0",
    "transformers",
    "datasets>=2.14.0,<3.0.0",  # ealvaradob/phishing-dataset uses old-style script, broken in datasets>=3
    "accelerate",
    "evaluate",
    "wandb",
    # Data tooling
    "pandas",
    "scikit-learn",
    "langdetect",
    "emoji",
    "regex",
    # Config
    "pyyaml",
    # Storage (checkpoint publishing)
    "supabase",
    # Interim model host (free-tier Supabase can't hold ~475MB checkpoints).
    "huggingface-hub",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "jupyter",
    "nbstripout",
    # Type stubs for strict-checked exporter code
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --------------------------------------------------------------------------
# Ruff: lint + format (CLAUDE.md §10)
# --------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print — no print() in non-notebook code (CLAUDE.md §10)
]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploration only and aren't linted in CI, but if ruff ever
# touches them, allow prints. Tests may use prints for debugging.
"tests/**" = ["T20"]

# --------------------------------------------------------------------------
# Mypy: strict for the exporter (backend contract), relaxed elsewhere
# (CLAUDE.md §10)
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
# Relaxed defaults for research-y ML code.
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false

[[tool.mypy.overrides]]
# src/exporter/ talks to the backend contract — hold it to a strict bar.
module = "src.exporter.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

# Priority classifier — baseline config.
# Encodes the locked training protocol from docs/ML_PIPELINE.md §2.
# Required fields (CLAUDE.md §6): model_name, dataset, hyperparameters, seed, output_dir.
# Commit this BEFORE running; it is how the run is reproduced.

model_type: priority
model_name: indobenchmark/indobert-base-p1   # LOCKED base model

# Dataset identifier consumed by src/data/loaders.py.
# NOTE: the external->4-class mapping is not yet finalized (see loaders.py).
dataset: jason23322/high-accuracy-email-classifier

# Number of target classes — matches priority_level enum (urgent|high|normal|low).
num_labels: 4

hyperparameters:
  learning_rate: 2.0e-5        # AdamW (ML_PIPELINE.md §2)
  weight_decay: 0.01
  batch_size: 16               # use gradient accumulation if VRAM-limited
  gradient_accumulation_steps: 1
  num_epochs: 4                # 3–5 with early stopping
  warmup_ratio: 0.10           # linear warmup 10% of steps, then linear decay
  lr_scheduler_type: linear
  max_seq_length: 512
  early_stopping_metric: macro_f1   # monitored on the validation set
  early_stopping_patience: 2
  class_weights: balanced      # weighted cross-entropy from training distribution
  mixed_precision: bf16        # falls back to fp16 if hardware lacks bf16

seed: 42

# Split fractions are fixed in src/data/splits.py (15% val / 15% test, stratified).
output_dir: checkpoints/priority_baseline

# Experiment tracking (CLAUDE.md §4). Run name + tags set at runtime.
wandb:
  project: priormail
  tags:
    - model:priority
    - stage:baseline

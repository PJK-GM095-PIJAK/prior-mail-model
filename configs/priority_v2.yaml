# Priority classifier — v2.0 (DistilBERT, English).
# Same locked protocol as priority_baseline.yaml (ML_PIPELINE.md §2). New lineage:
# DistilBERT base + the team-curated `insanar/prior-mail-priority` dataset, which
# carries direct 4-class labels and its own splits. The earlier IndoBERT v1.x
# checkpoints stay published and untouched; this is the v2.0 prod candidate.

model_type: priority
model_name: distilbert-base-uncased   # LOCKED base model

# Canonical priority dataset: direct 4-class labels + built-in splits.
dataset: insanar/prior-mail-priority
dataset_config: v2

num_labels: 4

hyperparameters:
  learning_rate: 2.0e-5
  weight_decay: 0.01
  batch_size: 16
  gradient_accumulation_steps: 1
  num_epochs: 4
  warmup_ratio: 0.10
  lr_scheduler_type: linear
  max_seq_length: 512
  early_stopping_metric: macro_f1
  early_stopping_patience: 2
  class_weights: balanced
  mixed_precision: bf16

seed: 42

# Separate output dir so it never overwrites another version's checkpoint.
output_dir: checkpoints/priority_v2

wandb:
  project: priormail
  tags:
    - model:priority
    - stage:prod-candidate
